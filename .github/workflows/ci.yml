name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR novo cancela a run anterior do mesmo branch; main não é cancelada
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # índice x páginas x demos x links dos papers
      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm exec prettier --check "src/**/*.{ts,tsx,css}" "*.{json,md}"

      - run: pnpm build
